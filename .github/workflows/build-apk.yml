name: Build APK

on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs can't read the branch-locked Production environment, so they only verify
  # the APK compiles against a placeholder key and upload nothing.
  verify-build:
    name: Verify APK build (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder .env
        run: |
          echo "BASE_URL=https://api.themoviedb.org/3" > .env
          echo "API_KEY=ci-placeholder" >> .env

      - name: Build APK
        run: flutter build apk --release

  # Push to deploy (or manual run on deploy): real key from the Production
  # environment, which is restricted to the deploy branch.
  build-apk:
    name: Build release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `.env` is gitignored but bundled as an asset, so write it from env secrets.
      - name: Create .env from secrets
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$BASE_URL" ]; then
            echo "::error::API_KEY and BASE_URL must be set in the Production environment secrets"
            exit 1
          fi
          echo "BASE_URL=$BASE_URL" > .env
          echo "API_KEY=$API_KEY" >> .env

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
